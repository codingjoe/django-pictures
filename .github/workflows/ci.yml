name: CI
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uvx --from build pyproject-build --sdist --wheel
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          path: dist/*
  pytest-os:
    name: PyTest
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        os:
          - "ubuntu-latest"
          - "macos-latest"
          - "windows-latest"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv run pytest -m "not benchmark"
      - uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          flags: ${{ matrix.os }}
  pytest-django:
    name: PyTest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.14"
          - "3.15"
        django-version:
          - "6.0"
          - "6.1"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv run --group=test --with Django~=${{ matrix.django-version }}.0 pytest -m "not benchmark"
      - uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          flags: py${{ matrix.python-version }}-dj${{ matrix.django-version }}
  pytest-extras:
    name: PyTest
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        django-version:
          - "6.0"
        extras:
          - "drf"
          - "cleanup"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv run --group=test --extra=${{ matrix.extras }} --with Django~=${{ matrix.django-version }}.0 pytest -m "not benchmark"
      - uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          flags: ${{ matrix.extras }}
