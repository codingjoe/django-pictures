{% load pictures %}{% include "admin/widgets/clearable_file_input.html" %}{% if widget.is_initial %}
<div class="picture-previews">{% for ratio in widget.value.aspect_ratios %}
  <figure>
    {% picture widget.value img_alt=widget.name img_loading="lazy" ratio=ratio container=200 %}
    <figcaption>{% if ratio %}{{ ratio }}{% else %}{{ widget.value.width }}×{{ widget.value.height }}{% endif %}</figcaption>
  </figure>{% endfor %}
</div>{% endif %}
