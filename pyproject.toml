[build-system]
build-backend = "flit_scm:buildapi"
requires = [ "flit-core>=3.2", "flit-scm", "wheel" ]

[project]
name = "django-pictures"
readme = "README.md"
keywords = [ "AVIF", "Django", "image", "pictures", "pillow", "WebP" ]
license = { file = "LICENSE" }
requires-python = ">=3.14"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Web Environment",
  "Framework :: Django",
  "Framework :: Django :: 6.0",
  "Framework :: Django :: 6.1",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: BSD License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
  "Topic :: Software Development",
]
dynamic = [ "description", "version" ]
dependencies = [ "django>=6", "pillow>=11.3" ]
[[project.authors]]
name = "Johannes Maron"
email = "johannes@maron.family"
[project.optional-dependencies]
cleanup = [
  "django-cleanup",
]
drf = [
  "djangorestframework",
]
[project.urls]
Changelog = "https://github.com/codingjoe/django-pictures/releases"
Documentation = "https://github.com/codingjoe/django-pictures#django-pictures"
Issue-Tracker = "https://github.com/codingjoe/django-pictures/issues"
Project-URL = "https://github.com/codingjoe/django-pictures"
Source = "https://github.com/codingjoe/django-pictures"

[dependency-groups]
dev = [
  { include-group = "test" },
]
test = [
  "pytest",
  "pytest-benchmark",
  "pytest-cov",
  "pytest-django",
]

[tool.setuptools_scm]
write_to = "pictures/_version.py"

[tool.flit]
[tool.flit.module]
name = "pictures"

[tool.ruff]
line-length = 88
indent-width = 4
src = [ "flit_gettext", "tests" ]
[tool.ruff.format]
preview = true
indent-style = "space"
quote-style = "double"
line-ending = "auto"
skip-magic-trailing-comma = false
[tool.ruff.lint]
extend-select = [
  "C90",
  "D",
  "D213",
  "DJ",
  "E",
  "G",
  "N",
  "PERF",
  "PT",
  "PTH",
  "RET",
  "S",
  "SIM",
  "SLOT",
  "T20",
  "TRY",
  "UP",
  "W",
]
ignore = [ "D1", "D203", "D212", "E501", "RUF01" ]
per-file-ignores."*/migrations/*.py" = [ "E501" ]
per-file-ignores."*/test*.py" = [ "E501", "PT011", "S101" ]
flake8-pytest-style.fixture-parentheses = false
flake8-pytest-style.mark-parentheses = false
isort.combine-as-imports = true
isort.force-wrap-aliases = true
isort.known-first-party = [ "pictures", "tests" ]
isort.section-order = [ "future", "standard-library", "third-party", "first-party", "local-folder" ]
isort.split-on-trailing-comma = true
pydocstyle.convention = "pep257"

[tool.isort]
atomic = true
line_length = 88
include_trailing_comma = true
combine_as_imports = true
default_section = "THIRDPARTY"
known_first_party = "pictures, tests"
skip = [ "pictures/_version.py" ]

[tool.pytest]
[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [ "tests" ]
addopts = "--cov --cov-report=xml --cov-report=term --tb=short -rxs  --benchmark-autosave --benchmark-min-rounds=10"
DJANGO_SETTINGS_MODULE = "tests.testapp.settings"

[tool.coverage]
[tool.coverage.run]
source = [ "pictures" ]
[tool.coverage.report]
skip_covered = true
show_missing = true

[tool.pydocstyle]
add_ignore = "D1"
