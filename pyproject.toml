[build-system]
build-backend = "flit_scm:buildapi"
requires = [ "flit-core>=3.2", "flit-scm", "wheel" ]

[project]
name = "django-pictures"
readme = "README.md"
keywords = [ "AVIF", "Django", "image", "pictures", "pillow", "WebP" ]
license = { file = "LICENSE" }
authors = [
  { name = "Johannes Maron", email = "johannes@maron.family" },
]
requires-python = ">=3.14"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Web Environment",
  "Framework :: Django",
  "Framework :: Django :: 6.0",
  "Framework :: Django :: 6.1",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: BSD License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
  "Topic :: Software Development",
]
dynamic = [ "description", "version" ]
dependencies = [ "django>=6", "pillow>=11.3" ]
optional-dependencies.cleanup = [
  "django-cleanup",
]
optional-dependencies.drf = [
  "djangorestframework",
]
urls.Changelog = "https://github.com/codingjoe/django-pictures/releases"
urls.Documentation = "https://github.com/codingjoe/django-pictures#django-pictures"
urls.Issue-Tracker = "https://github.com/codingjoe/django-pictures/issues"
urls.Project-URL = "https://github.com/codingjoe/django-pictures"
urls.Source = "https://github.com/codingjoe/django-pictures"

[dependency-groups]
dev = [
  { include-group = "test" },
]
test = [
  "pytest",
  "pytest-benchmark",
  "pytest-cov",
  "pytest-django",
]

[tool.setuptools_scm]
write_to = "pictures/_version.py"

[tool.flit]
module.name = "pictures"

[tool.ruff]
line-length = 88
indent-width = 4
src = [ "flit_gettext", "tests" ]
format.preview = true
format.indent-style = "space"
format.quote-style = "double"
format.line-ending = "auto"
format.skip-magic-trailing-comma = false
lint.select = [
  "D",   # pydocstyle
  "EXE", # flake8-executable
  "F",   # pyflakes
  "I",   # isort
  "PT",  # flake8-pytest-style
  "RET", # flake8-return
  "S",   # flake8-bandit
  "SIM", # flake8-simplify
  "UP",  # pyupgrade
  "W",   # pycodestyle warnings
]
lint.ignore = [ "D1" ]
lint.per-file-ignores."*/migrations/*.py" = [ "E501" ]
lint.per-file-ignores."*/test*.py" = [ "E501", "PT011", "S101" ]
lint.flake8-pytest-style.fixture-parentheses = false
lint.flake8-pytest-style.mark-parentheses = false
lint.isort.combine-as-imports = true
lint.isort.force-wrap-aliases = true
lint.isort.known-first-party = [ "pictures", "tests" ]
lint.isort.section-order = [ "future", "standard-library", "third-party", "first-party", "local-folder" ]
lint.isort.split-on-trailing-comma = true
lint.pydocstyle.convention = "pep257"

[tool.isort]
atomic = true
line_length = 88
include_trailing_comma = true
combine_as_imports = true
default_section = "THIRDPARTY"
known_first_party = "pictures, tests"
skip = [ "pictures/_version.py" ]

[tool.pytest]
ini_options.minversion = "6.0"
ini_options.testpaths = [ "tests" ]
ini_options.addopts = """\
  --cov --cov-report=xml --cov-report=term --tb=short -rxs  --benchmark-autosave --benchmark-min-rounds=10\
  """
ini_options.DJANGO_SETTINGS_MODULE = "tests.testapp.settings"

[tool.coverage]
run.source = [ "pictures" ]
report.skip_covered = true
report.show_missing = true

[tool.pydocstyle]
add_ignore = "D1"
